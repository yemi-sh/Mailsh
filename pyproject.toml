[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsh"
version = "1.0.0"
description = "A robust command-line email sending client"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "prompt-toolkit>=3.0.0",
    "mcp-server==0.1.4",
]

[project.scripts]
mailsh = "mailsh_app.__main__:main"

[tool.setuptools]
packages = ["mailsh_app", "mailsh_app.cli", "mailsh_app.cli.commands", "mailsh_app.core", "mailsh_app.features", "mailsh_app.features.safety", "mailsh_app.mcp", "mailsh_app.utils"]